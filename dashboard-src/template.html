<style>
/* Layout: control-room console — status header, live gauges, then detail panels in a 2-column grid that stacks on phones.
   Deliberately single dark look (an operations screen), so no light-theme blocks.
   Phase 4: the same look, now fed by live Supabase data (Realtime) with a manual switch back to the simulation. */
:root {
  color-scheme: dark;
  --bg: #0B2321;        /* deep reservoir green */
  --panel: #123532;
  --line: #1F4743;
  --fg: #E9F1EE;
  --muted: #9BB8B1;
  --ok: #3DBE8B;
  --warn: #E8A93A;
  --bad: #F0603C;
  --blue: #5AB0F0;
  --display: 'Cairo', 'IBM Plex Sans Arabic', Tahoma, sans-serif;
  --body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1480px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 40px; display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 560px) { .wrap { padding-inline: 16px; } }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
[hidden] { display: none !important; }
body[data-mode="live"] .simOnly, body[data-mode="sim"] .liveOnly { display: none !important; }

/* header */
.head { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
.title { font-family: var(--display); font-size: clamp(1.4rem, 3vw, 2.1rem); font-weight: 800; line-height: 1.2; margin: 0; text-wrap: balance; }
.title span { color: var(--ok); }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand .mark { width: clamp(46px, 5vw, 62px); height: auto; flex: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.25)); }
.sub { color: var(--muted); font-size: .9rem; }
.status { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.clock { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 16px; text-align: center; }
.clock b { display: block; font-family: var(--mono); font-size: 1.45rem; font-weight: 500; }
.clock small, .valve small { color: var(--muted); font-size: .78rem; }
.valve { border-radius: 12px; padding: 8px 16px; font-weight: 700; display: flex; flex-direction: column; justify-content: center; min-width: 150px; }
.valve.ok { background: rgba(61,190,139,.13); border: 1.5px solid var(--ok); color: var(--ok); }
.valve.bad { background: rgba(240,96,60,.16); border: 1.5px solid var(--bad); color: var(--bad); animation: pulse 1.2s infinite; }
.valve.safe { background: rgba(232,169,58,.16); border: 1.5px solid var(--warn); color: var(--warn); }
.valve.na { background: transparent; border: 1.5px dashed var(--line); color: var(--muted); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(240,96,60,.55); } 70% { box-shadow: 0 0 0 12px rgba(240,96,60,0); } 100% { box-shadow: 0 0 0 0 rgba(240,96,60,0); } }
@media (max-width: 560px) { .valve { min-width: 0; flex: 1 1 130px; } .clock { flex: 1 1 100%; } }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.controls .grp { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.controls .sep { width: 1px; align-self: stretch; background: var(--line); }
@media (max-width: 700px) { .controls .sep { display: none; } }
button, select, input { font: inherit; color: inherit; }
.btn { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap; }
.btn:hover { background: rgba(255,255,255,.05); border-color: var(--muted); }
.btn:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
.btn.primary { background: var(--ok); border-color: var(--ok); color: #0B2321; font-weight: 700; }
.btn.danger { border-color: rgba(240,96,60,.6); }
.btn.on { border-color: var(--ok); color: var(--ok); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg .btn { border: 0; border-radius: 0; }
.seg .btn[aria-pressed="true"] { background: var(--ok); color: #0B2321; font-weight: 700; }
.seg .btn[aria-pressed="true"].sim { background: var(--warn); }
.conn { font-size: .84rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.conn.ok { color: var(--ok); border-color: rgba(61,190,139,.6); }
.conn.warn { color: var(--warn); border-color: rgba(232,169,58,.6); }
.conn.bad { color: var(--bad); border-color: rgba(240,96,60,.6); }
.lbl { color: var(--muted); font-size: .85rem; }
select, input[type=text], input[type=number] { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
details.settings { width: 100%; }
details.settings summary { cursor: pointer; color: var(--muted); font-size: .9rem; padding: 2px 0; }
.setgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
.setgrid label { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--muted); }
.setgrid input { width: 100%; min-width: 0; }

/* banners */
.alert { background: rgba(240,96,60,.12); border: 1px solid var(--bad); border-radius: 12px; padding: 10px 16px; }
.alert b { color: var(--bad); }
.alert.ai { background: rgba(90,176,240,.10); border-color: var(--blue); }
.alert.ai b { color: var(--blue); }
.alert.warnbar { background: rgba(232,169,58,.10); border-color: var(--warn); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.alert.warnbar b { color: var(--warn); }

/* gauges */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
@media (max-width: 560px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card { background: var(--panel); border: 1px solid var(--line); border-inline-start: 4px solid var(--c, var(--ok)); border-radius: 12px; padding: 10px 14px; min-width: 0; }
.card .k { color: var(--muted); font-size: .82rem; }
.card .v { font-size: 1.65rem; font-weight: 700; }
.card .u { color: var(--muted); font-size: .8rem; margin-inline-start: 4px; }
.card .s { color: var(--c); font-size: .76rem; font-weight: 600; }
.card .n { color: var(--muted); font-size: .72rem; }

/* main grid */
.grid { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
h2 { font-size: 1.02rem; font-weight: 700; margin: 0; }
.charts4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .charts4 { grid-template-columns: minmax(0, 1fr); } }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; direction: ltr; min-width: 0; }
.chart .ct { color: var(--muted); font-size: .82rem; padding: 2px 8px 0; direction: inherit; }
[dir=rtl] .chart .ct { direction: rtl; text-align: right; }
.plot { width: 100%; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.panel h3 { margin: 0 0 4px; font-size: .86rem; color: var(--muted); font-weight: 600; }
.big { font-size: 1.5rem; font-weight: 700; line-height: 1.3; }
.small { color: var(--muted); font-size: .85rem; }
.bar { height: 7px; background: var(--line); border-radius: 6px; overflow: hidden; margin-top: 8px; }
.bar > div { height: 100%; border-radius: 6px; transition: width .4s; }
.impact { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
@media (min-width: 560px) and (max-width: 900px) { .impact { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* event log */
.log { max-height: 340px; overflow-y: auto; padding-block: 4px; }
.lrow { display: grid; grid-template-columns: 74px minmax(110px, 0.9fr) minmax(0, 2.2fr) 84px 104px; gap: 8px; align-items: start; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .86rem; }
.lrow.hd { color: var(--muted); font-size: .76rem; font-weight: 600; position: sticky; top: 0; background: var(--panel); padding-top: 2px; }
.lrow .tm { color: var(--muted); font-family: var(--mono); }
.lrow .why { color: var(--fg); overflow-wrap: anywhere; }
.tag { display: inline-block; font-size: .74rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.rule { color: var(--ok); border-color: rgba(61,190,139,.5); }
.tag.ai { color: var(--blue); border-color: rgba(90,176,240,.55); }
.tag.user { color: var(--warn); border-color: rgba(232,169,58,.55); }
@media (max-width: 700px) {
  .lrow { grid-template-columns: 70px minmax(0, 1fr); }
  .lrow .why { grid-column: 1 / -1; }
  .lrow.hd { display: none; }
}
.empty { color: var(--muted); font-size: .88rem; padding: 10px 0; }
.foot { color: var(--muted); font-size: .8rem; border-top: 1px solid var(--line); padding-top: 12px; }
@media (prefers-reduced-motion: reduce) { .valve.bad { animation: none; } .bar > div { transition: none; } }
</style>

<script>
"use strict";
/* ===================== Live data source (Supabase, phase 3) ===================== */
// Public key: it can only INSERT and SELECT on the two tables (row level security). Never put a secret key here.
const SUPABASE_URL = "https://vnwptdfnleongvkbiydc.supabase.co";
const SUPABASE_KEY = "sb_publishable_A-NSuIONi17ERzZtFdh3Yg_eM0yMuHV";
const LIVE = {
  windowSec: 600,   // charts show the last 10 minutes (the ESP32 sends 1 reading/s in demo mode)
  firstLoad: 600,   // rows fetched on start
  maxRows: 3600,    // kept in memory (1 hour at 1 reading/s)
  pollMs: 3000,     // safety net next to Realtime: ask for rows newer than the last one we have
  staleSec: 10,     // no new reading for this long = the device (Wokwi) is probably stopped
  aiRecover: 20,    // AI alert clears after this many normal readings in a row (20 s in demo mode)
  aiDedupSec: 60,   // do not write the same AI event twice within this window (several viewers)
};

/* ===================== Models (exported from scikit-learn) ===================== */
const MODELS = JSON.parse(document.getElementById("models").textContent);
function walk(tr, x) { const [f, t, l, r] = tr; let i = 0; while (f[i] !== -1) i = x[f[i]] <= t[i] ? l[i] : r[i]; return t[i]; }
// IsolationForest.decision_function — identical to scikit-learn
function anomalyDecision(x) {
  const F = MODELS.iforest; let s = 0;
  for (const tr of F.trees) s += walk(tr, x);
  return -Math.pow(2, -s / (F.trees.length * F.c)) - F.offset;
}
// HistGradientBoostingRegressor.predict — identical to scikit-learn
function hgbPredict(x) { let s = MODELS.hgb.base; for (const tr of MODELS.hgb.trees) s += walk(tr, x); return s; }

/* ===================== Shared rules ===================== */
const PRAYERS = ["fajr", "dhuhr", "asr", "maghrib", "isha"];
const DEFAULT_TIMES = { fajr: "04:28", dhuhr: "11:43", asr: "15:08", maghrib: "17:38", isha: "19:08" };
const TRAIN_PER_PRAYER = 150 * 4;   // the forecaster was trained with 150 worshippers × 4 L
// pH 6.5–8.4, turbidity ≤ 5 NTU, chlorine 0.2–0.5 mg/L: MEWA greywater guide (1429H) and treated-water standards (2025).
// UV ≥ 70 %: approved design. Storage ≤ 90 %: approved design. DO ≥ 1.0 and ORP ≤ 400 mV: simulation demo values.
const LIMITS = { ph: [6.5, 8.4], turb: [null, 5.0], do: [1.0, null], orp: [null, 400.0], uv: [70.0, null] };
const LIVE_LIMITS = { ph: [6.5, 8.4], turb: [null, 5.0], uv: [70.0, null], cl: [0.2, 0.5], level: [null, 90.0] };
const NORMAL = { ph: [7.3, 0.12], turb: [2.0, 0.30], orp: [180, 15], do_resid: [0, 0.20] };
const UV_NORMAL_DECAY = 30 / (9000 * 60), UV_AGING_MULT = 5000;
const IRRIGATION = [[5 * 60 + 15, 6 * 60 + 30], [20 * 60, 21 * 60 + 30]];
const FEATURES = ["ph", "turb", "do_resid", "orp"];
// which valve protects against which cause (same split as the ESP32 rules)
const DIAG_VALVE = { chlorine: "valve1", detergent: "valve1", ph: "valve1", pattern: "valve1", turbidity: "valve2", uv: "valve2", sensor: "both" };

const mod = (a, n) => ((a % n) + n) % n;
const clip = (v, a, b) => Math.min(b, Math.max(a, v));
const toMin = s => { const m = /^\s*(\d{1,2}):(\d{2})\s*$/.exec(s); if (!m || +m[1] > 23 || +m[2] > 59) throw new Error("time"); return +m[1] * 60 + +m[2]; };
const hhmm = m => { m = mod(Math.floor(m), 1440); return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
function randn(mu = 0, sd = 1) { let u = 0, v = 0; while (u === 0) u = Math.random(); while (v === 0) v = Math.random(); return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const doBaseline = aer => 1.2 + 2.6 * aer / 100;
// residual chlorine from ORP2: same two-point line as sketch.ino (650 mV → 0.2, 750 mV → 0.5). Estimate, needs a DPD calibration.
const clFromOrp2 = mv => mv === null || mv === undefined ? null : Math.max(0, 0.2 + (mv - 650) * 0.003);

function inflowAt(tod, pm, friday, cfg) {
  let flow = 0.3; const per = cfg.worshippers * cfg.lpa;
  for (const p of PRAYERS) {
    let vol = per, mu = pm[p] - 8, sd = 7;
    if (friday && p === "dhuhr") { vol = per * 3; mu = pm[p] - 25; sd = 16; }
    const d = mod(tod - mu + 720, 1440) - 720;
    flow += vol * Math.exp(-0.5 * (d / sd) ** 2) / (sd * Math.sqrt(2 * Math.PI));
  }
  return flow;
}
function features(tod, pm, friday) {
  const x = PRAYERS.map(p => clip(mod(tod - pm[p] + 720, 1440) - 720, -180, 180));
  x.push(friday ? 1 : 0, tod / 60); return x;
}
function forecastDay(pm, cfg, friday) {
  const ratio = (cfg.worshippers * cfg.lpa) / TRAIN_PER_PRAYER, out = new Float64Array(1440);
  for (let t = 0; t < 1440; t++) out[t] = Math.max(0, 0.3 + (Math.max(0, hgbPredict(features(t, pm, friday))) - 0.3) * ratio);
  return out;
}
function peakRef(fc) { let best = 1; for (let t = 0; t < 1440; t++) { let s = 0; for (let k = 0; k < 30; k++) s += fc[(t + k) % 1440]; best = Math.max(best, s); } return best; }
function aerationPlan(fc, ref, tod) { let nxt = 0; for (let k = 1; k <= 30; k++) nxt += fc[(tod + k) % 1440]; return clip(30 + 70 * nxt / ref, 30, 100); }
function nextPeakOf(pm, fc, tod) {
  let best = null;
  for (const p of PRAYERS) { const dt = mod(pm[p] - tod, 1440); if (!best || dt < best[1]) best = [p, dt]; }
  let vol = 0; for (let t = pm[best[0]] - 60; t < pm[best[0]] + 15; t++) vol += fc[mod(t, 1440)];
  return [best[0], best[1], vol];
}
function diagnose(zd, uv, b) {
  if (b.includes("sensor")) return "sensor";
  if (zd.orp > 4 || b.includes("orp")) return "chlorine";
  if (zd.turb > 4 && zd.do_resid < -3) return "detergent";
  if (b.includes("uv") || uv < LIMITS.uv[0]) return "uv";
  if (Math.abs(zd.ph) > 4 || b.includes("ph")) return "ph";
  if (zd.turb > 4 || b.includes("turb")) return "turbidity";
  return "pattern";
}

/* ===================== Simulation (port of sim.py) — fallback / offline demo ===================== */
class Simulation {
  constructor(times, cfg, startMinute, startFriday) {
    this.cfg = cfg; this.pm = {}; for (const p of PRAYERS) this.pm[p] = toMin(times[p]);
    this.startWeekday = startFriday ? 4 : 3;
    this.minute = startMinute; this.bio = 1; this.uv = 96; this.uvAging = false; this.effects = [];
    this.faultLeft = 0; this.frozenPh = null; this.phWin = [];
    this.diverting = false; this.bad = 0; this.good = 0; this.diagnosis = null;
    this.tank = 900; this.reused = 0; this.diverted = 0; this.overflow = 0; this.aerSum = 0; this.ticks = 0;
    this.history = []; this.events = []; this._day = null; this.newDay();
  }
  get tod() { return mod(this.minute, 1440); }
  get day() { return Math.floor(this.minute / 1440); }
  get friday() { return (this.startWeekday + this.day) % 7 === 4; }
  forecastDay(friday) { return forecastDay(this.pm, this.cfg, friday); }
  newDay() {
    this._day = this.day; this.fc = this.forecastDay(this.friday);
    this.actual = new Array(1440).fill(null); this.aerDay = new Array(1440).fill(null);
    this.attendance = 0.85 + Math.random() * 0.3;
    this.fcRef = peakRef(this.fc);
  }
  log(kind, detail, by) { this.events.unshift({ minute: this.minute, kind, detail, by }); this.events.length = Math.min(this.events.length, 60); }
  trigger(kind) {
    if (kind === "chlorine") { this.effects.push({ type: "chlorine", age: 0 }); this.bio *= 0.45; }
    else if (kind === "detergent") { this.effects.push({ type: "detergent", age: 0 }); this.bio *= 0.85; }
    else if (kind === "uv_aging") this.uvAging = true;
    else if (kind === "replace_uv") { this.uvAging = false; this.uv = 100; }
    else if (kind === "sensor_fault") { this.faultLeft = 90; this.frozenPh = null; }
    this.log(kind, null, "user");
  }
  nextPeak() { return nextPeakOf(this.pm, this.fc, this.tod); }
  uvDaysLeft() { const rate = UV_NORMAL_DECAY * (this.uvAging ? UV_AGING_MULT : 1); return this.uv <= LIMITS.uv[0] ? 0 : (this.uv - LIMITS.uv[0]) / rate / 1440; }
  monthlyM3() { const n = this.forecastDay(false).reduce((a, b) => a + b, 0), f = this.forecastDay(true).reduce((a, b) => a + b, 0); return (6 * n + f) / 7 * 30 / 1000; }
  get energySaved() { return this.ticks ? 100 - this.aerSum / this.ticks : 0; }

  step() {
    if (this.day !== this._day) this.newDay();
    const tod = this.tod;
    const truth = inflowAt(tod, this.pm, this.friday, this.cfg) * this.attendance;
    const inflow = Math.max(0, truth + randn(0, 0.15 + 0.12 * truth));
    this.actual[tod] = inflow;

    const aer = aerationPlan(this.fc, this.fcRef, tod);
    this.aerDay[tod] = aer; this.aerSum += aer;

    let phAdd = 0, turbAdd = 0, doSub = 0, orpAdd = 0;
    for (const e of this.effects) {
      const a = e.age;
      if (e.type === "chlorine") { orpAdd += 480 * Math.exp(-a / 25); phAdd += 0.5 * Math.exp(-a / 30); }
      else { turbAdd += 7 * Math.exp(-a / 40); doSub += 1.6 * Math.exp(-a / 40); phAdd += 0.45 * Math.exp(-a / 40); }
      e.age++;
    }
    this.effects = this.effects.filter(e => e.age < 200);
    this.bio += (1 - this.bio) * 0.02;

    let ph = randn(...NORMAL.ph) + phAdd;
    if (this.faultLeft > 0) { if (this.frozenPh === null) this.frozenPh = Math.round(ph * 100) / 100; ph = this.frozenPh; this.faultLeft--; } else this.frozenPh = null;
    this.phWin.push(ph); if (this.phWin.length > 10) this.phWin.shift();
    const phStuck = this.phWin.length === 10 && Math.max(...this.phWin) - Math.min(...this.phWin) < 1e-6;
    const turb = Math.max(0.1, randn(...NORMAL.turb) + 0.004 * inflow + (1 - this.bio) * 7 + turbAdd);
    const dox = Math.max(0, doBaseline(aer) + randn(...NORMAL.do_resid) + (1 - this.bio) * 2 - doSub);
    const orp = randn(...NORMAL.orp) + orpAdd;
    this.uv = Math.max(0, this.uv - UV_NORMAL_DECAY * (this.uvAging ? UV_AGING_MULT : 1));
    const uv = this.uv + randn(0, 0.3);
    const cl = clip(0.35 + randn(0, 0.015), 0, 2), temp = 25 + randn(0, 0.15);   // simulated, for the two extra cards

    const x = [ph, turb, dox - doBaseline(aer), orp];
    const score = -anomalyDecision(x);
    const z = x.map((v, i) => (v - MODELS.stats.mean[i]) / MODELS.stats.std[i]);
    const zd = {}; FEATURES.forEach((k, i) => zd[k] = z[i]);
    const mlFlag = score > 0 && Math.max(...z.map(Math.abs)) >= 3.5;

    const vals = { ph, turb, do: dox, orp, uv }, breaches = [];
    for (const k in LIMITS) { const [lo, hi] = LIMITS[k]; if ((lo !== null && vals[k] < lo) || (hi !== null && vals[k] > hi)) breaches.push(k); }
    // sensor health: a real probe always shows small noise; a flat line or a physically impossible value = sensor fault
    if (phStuck || ph < 0 || ph > 14 || turb > 1000 || dox > 20 || Math.abs(orp) > 1200) breaches.push("sensor");
    const flag = mlFlag || breaches.length > 0;
    if (flag) { this.bad++; this.good = 0; } else { this.good++; this.bad = 0; }

    if (!this.diverting && (this.bad >= 2 || breaches.length)) {
      this.diverting = true; this.diagnosis = diagnose(zd, uv, breaches); this.log("divert", this.diagnosis, breaches.length ? "rule" : "ai");
    } else if (this.diverting && this.good >= 20) {
      this.diverting = false; this.log("recover", this.diagnosis, "rule"); this.diagnosis = null;
    }

    if (this.diverting) this.diverted += inflow; else this.tank += inflow;
    let demand = 0.3 * inflow + 0.2;
    if (IRRIGATION.some(([a, b]) => a <= tod && tod < b)) demand += 18;
    const supply = Math.min(this.tank, demand);
    this.tank -= supply; this.reused += supply;
    if (this.tank > 2500) { this.overflow += this.tank - 2500; this.tank = 2500; }

    this.ticks++;
    this.history.push({ minute: this.minute, ph, turb, do: dox, orp, uv, cl, temp, level: 100 * this.tank / 2500, inflow, aer, score, flag,
      diverting: this.diverting, z_ph: zd.ph, z_turb: zd.turb, z_do: zd.do_resid, z_orp: zd.orp });
    if (this.history.length > 720) this.history.shift();
    this.minute++;
  }
  run(n) { for (let i = 0; i < n; i++) this.step(); }
}

  $("aiAlert").hidden = true; $("connBar").hidden = true;

  const statusOf = k => {
    if (k === "cl") return row.cl < 0.2 || row.cl > 0.5 ? "alarm" : "ok";
    if (k === "temp") return "ok";
    if (LIMITS[k]) { const [lo, hi] = LIMITS[k]; if ((lo !== null && row[k] < lo) || (hi !== null && row[k] > hi)) return "alarm"; }
    if (k === "level") return row[k] < 10 || row[k] > 97 ? "warn" : "ok";
    if (k === "uv") return row[k] < 80 ? "warn" : "ok";
    return Math.abs(row["z_" + k]) >= 3 ? "warn" : "ok";
  };
  const fmt = { ph: 2, orp: 0, do: 1, temp: 1, turb: 1, uv: 1, cl: 2, level: 0 };
  setCards(Object.keys(fmt).map(k => ({ k, v: row[k], d: fmt[k], st: statusOf(k) })));

  $("sensorsTitle").textContent = t("sensors_sim");
  const shapes = shadeRanges(rangesOf(h, r => r.diverting, r => isoOf(r.minute), isoOf(h[h.length - 1].minute + 1)));
  sensorCharts(xs, k => h.map(r => r[k]), shapes, LIMITS, "%H:%M");
  const fl = h.filter(r => r.flag);
  aiCharts(xs, h.map(r => r.score), fl.map(r => isoOf(r.minute)), fl.map(r => r.score), ["orp", "turb", "do", "ph"].map(k => Math.abs(row["z_" + k])), "%H:%M");
  $("normalNote").textContent = sim.diverting ? "" : t("normal_state");

  const m0 = sim.day * 1440, fx = [], fy = [], ay = [], ey = [];
  for (let i = 0; i < 1440; i += 2) { fx.push(isoOf(m0 + i)); fy.push(sim.fc[i]); ay.push(sim.actual[i] ?? sim.actual[i + 1]); ey.push(sim.aerDay[i]); }
  const pmx = {}; for (const p of PRAYERS) pmx[p] = isoOf(m0 + sim.pm[p]);
  forecastChart(fx, fy, ay, ey, pmx, sim.friday, isoOf(sim.minute));

  peakPanel(sim.pm, sim.fc, sim.tod, sim.friday, row.aer);
  $("energyPanel").innerHTML = `<h3>${t("energy")}</h3><div class="big" style="color:${C.ok}"><span class="num">≈ ${sim.energySaved.toFixed(0)}%</span></div><div class="small">${t("energy_sub")}</div>`;
  const days = sim.uvDaysLeft(); let msg, col;
  if (days <= 0) { msg = t("uv_now"); col = C.bad; }
  else { msg = t("uv_left", { x: `<span class="num">${days >= 2 ? t("days", { n: n0(days) }) : t("hours", { n: (days * 24).toFixed(1) })}</span>` }); col = days < 30 ? C.warn : C.ok; }
  const uvp = clip(sim.uv, 0, 100);
  $("maintPanel").innerHTML = `<h3>${t("maint")}</h3><div class="big" style="color:${col};font-size:1.1rem">${msg}</div>
    <div class="small">${t("uv")}: <span class="num">${uvp.toFixed(1)}%</span> · ${t("safe_limit")} <span class="num">70%</span></div>
    <div class="bar"><div style="width:${uvp.toFixed(0)}%;background:${col}"></div></div>`;

  $("impactTitle").textContent = t("water_title");
  $("impact").innerHTML = `<div class="card" style="--c:${C.ok}"><div class="k">${t("reused")}</div><span class="v num">${fmtL(sim.reused)}</span></div>
    <div class="card" style="--c:${C.bad}"><div class="k">${t("unsafe")}</div><span class="v num">${fmtL(sim.diverted)}</span></div>
    <div class="card" style="--c:${C.blue}"><div class="k">${t("month")}</div><span class="v num">≈ ${n0(monthlyCache)} m³</span></div>`;

  setLog(sim.events.map(e => {
    const scen = ["chlorine", "detergent", "uv_aging", "replace_uv", "sensor_fault"].includes(e.kind);
    const reason = e.kind === "divert" ? t("dg_" + e.detail) : e.kind === "recover" ? t("ev_recover") : t("ev_" + e.kind);
    return { tm: hhmm(e.minute), icon: ICONS[e.kind] || "•", label: scen ? t("e_scenario") : t("e_" + e.kind), reason,
      valve: e.kind === "divert" || e.kind === "recover" ? (DIAG_VALVE[e.detail] || "valve1") : null, by: e.by || "sys" };
  }));
  $("disclaimer").textContent = t("disc_sim");
}

let fcCache = { key: "", fc: null, ref: 1, aer: null };
function liveForecast(now) {
  const friday = now.getDay() === 5, key = now.toDateString() + JSON.stringify(settings.times) + JSON.stringify(settings.cfg);
  if (fcCache.key !== key) {
    const pm = {}; for (const p of PRAYERS) pm[p] = toMin(settings.times[p]);
    const fc = forecastDay(pm, settings.cfg, friday), ref = peakRef(fc), aer = new Array(1440);
    for (let i = 0; i < 1440; i++) aer[i] = aerationPlan(fc, ref, i);
    fcCache = { key, fc, ref, aer, pm, friday };
  }
  return fcCache;
}
function renderLive() {
  const now = new Date(), rows = live.rows, last = rows[rows.length - 1] || null;
  $("subtitle").textContent = t("sub_live");
  $("clock").textContent = hms(now);
  $("dayname").textContent = DAYS[lang][dayIdx(now)];

  // connection status
  const age = last ? (now - last.t) / 1000 : null, conn = $("conn");
  let cls = "ok", txt;
  if (live.state === "loading") { cls = ""; txt = t("conn_loading"); }
  else if (live.state === "error") { cls = "bad"; txt = t("conn_err"); }
  else if (!last) { cls = "warn"; txt = t("conn_wait"); }
  else if (age > LIVE.staleSec) { cls = "warn"; txt = t("conn_stale", { s: agoText(age) }); }
  else txt = t("conn_ok", { s: agoText(age) });
  if (live.state === "ok") txt += " · " + (live.rt ? t("rt_on") : t("rt_off"));
  conn.className = "conn liveOnly " + cls; conn.textContent = txt;
  const showErr = live.state === "error", showStale = live.state === "ok" && last && age > LIVE.staleSec;
  $("connBar").hidden = !(showErr || showStale);
  if (showErr) { $("connBarT").textContent = t("err_t"); $("connBarTxt").textContent = t("err_txt", { e: /fetch|network/i.test(live.err) ? t("net_word") : live.err }); }
  else if (showStale) { $("connBarT").textContent = t("stale_t"); $("connBarTxt").textContent = t("stale_txt", { s: agoText(age) }); }

  // valves + alerts (the ESP32 decides; we show what it reported)
  setValve("v1", last ? last.valve1 : null); setValve("v2", last ? last.valve2 : null);
  $("safe").hidden = !(last && last.safe_mode);
  if (last && (last.safe_mode || last.sewer)) {
    $("alert").hidden = false;
    $("alertT").textContent = last.safe_mode ? t("alert_safe") : t("alert_rule");
    const why = [];
    const lastOf = (type, v) => live.events.find(e => e.type === type && e.decided_by === "rule" && (!v || e.valve === v || e.valve === "both"));
    if (last.safe_mode) { const e = lastOf("safe_mode"); if (e) why.push(e.reason); }
    else { for (const v of ["valve1", "valve2"]) if (last[v] === "sewer") { const e = lastOf("divert", v); why.push(e ? `${t(v)}: ${e.reason}` : `${t(v)}: ${t("v_sewer")}`); } }
    $("alertTxt").textContent = why.join(" · ");
  } else $("alert").hidden = true;
  const st = live.ai;
  $("aiAlert").hidden = !st.active;
  if (st.active) $("aiAlertTxt").textContent = t("ai_alert_txt", { d: t("dg_" + (st.diag || "pattern")), v: t(DIAG_VALVE[st.diag] || "valve1") });

  // cards
  const z = last && last.ai ? last.ai.z : null;
  const stOf = (k, v) => {
    if (v === null || v === undefined) return "na";
    const L = LIVE_LIMITS[k]; if (L) { const [lo, hi] = L; if ((lo !== null && v < lo) || (hi !== null && v > hi)) return "alarm"; }
    if (k === "uv") return v < 80 ? "warn" : "ok";
    const zi = { ph: 0, turb: 1, do: 2, orp: 3 }[k];
    if (zi !== undefined && z && Math.abs(z[zi]) >= 3) return "warn";
    return "ok";
  };
  const cardDef = [["ph", "ph", 2], ["orp", "orp_in_mv", 0], ["do", "do_mgl", 1], ["temp", "temp_c", 1], ["turb", "turbidity", 1], ["uv", "uv_pct", 1], ["cl", "cl", 2], ["level", "level_pct", 0]];
  setCards(cardDef.map(([k, f, d]) => { const v = last ? last[f] : null; return { k, v, d, st: stOf(k, v), note: k === "cl" ? t("cl_note") : "" }; }));

  // charts: last LIVE.windowSec seconds of data (relative to the newest reading, so old data still shows when Wokwi is stopped)
  const tEnd = last ? last.t.getTime() : now.getTime(), win = rows.filter(r => r.t.getTime() > tEnd - LIVE.windowSec * 1000);
  const xs = win.map(r => localStr(r.t)), xEnd = last ? localStr(new Date(tEnd + 1000)) : localStr(now);
  $("sensorsTitle").textContent = t("sensors_live");
  const fld = { orp: "orp_in_mv", turb: "turbidity", do: "do_mgl", ph: "ph" };
  sensorCharts(xs, k => win.map(r => r[fld[k]]), shadeRanges(rangesOf(win, r => r.sewer, r => localStr(r.t), xEnd)), { ph: LIVE_LIMITS.ph, turb: LIVE_LIMITS.turb }, "%H:%M:%S");
  const fl = win.filter(r => r.ai && r.ai.flag);
  aiCharts(xs, win.map(r => r.ai ? r.ai.score : null), fl.map(r => localStr(r.t)), fl.map(r => r.ai.score),
    z ? [z[3], z[1], z[2], z[0]].map(Math.abs) : null, "%H:%M:%S");
  $("normalNote").textContent = !last ? "" : !last.ai ? t("ai_na") : st.active ? "" : t("ai_normal");

  // forecast for today's real date and time
  const F = liveForecast(now), tod = now.getHours() * 60 + now.getMinutes();
  const day0 = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} `, fx = [], fy = [], ey = [];
  for (let i = 0; i < 1440; i += 2) { fx.push(day0 + hhmm(i)); fy.push(F.fc[i]); ey.push(F.aer[i]); }
  const pmx = {}; for (const p of PRAYERS) pmx[p] = day0 + hhmm(F.pm[p]);
  forecastChart(fx, fy, null, ey, pmx, F.friday, day0 + hhmm(tod));
  peakPanel(F.pm, F.fc, tod, F.friday, F.aer[tod]);

  // pumps (from the ESP32) and UV
  const onoff = v => v === true ? `<span style="color:${C.ok}">${t("on")}</span>` : v === false ? `<span style="color:${C.muted}">${t("off")}</span>` : "—";
  $("energyPanel").innerHTML = `<h3>${t("pumps")}</h3><div class="big" style="font-size:1.1rem">${t("air_pump")}: ${onoff(last ? last.air_pump : null)} · ${t("cl_pump")}: ${onoff(last ? last.cl_pump : null)}</div>
    <div class="small">${t("cl_pump_note")}</div>`;
  const uv = last ? last.uv_pct : null, uvCol = uv === null ? C.muted : uv < 70 ? C.bad : uv < 80 ? C.warn : C.ok;
  $("maintPanel").innerHTML = `<h3>${t("maint")}</h3><div class="big" style="color:${uvCol};font-size:1.1rem">${uv === null ? "—" : uv < 70 ? t("uv_now") : t("uv_live_ok")}</div>
    <div class="small">${t("uv")}: <span class="num">${uv === null ? "—" : uv.toFixed(1) + "%"}</span> · ${t("safe_limit")} <span class="num">70%</span></div>
    <div class="bar"><div style="width:${uv === null ? 0 : clip(uv, 0, 100).toFixed(0)}%;background:${uvCol}"></div></div><div class="small">${t("uv_live_pred")}</div>`;

  // live data summary (last hour)
  const hour = rows.filter(r => r.t.getTime() > now.getTime() - 3600e3);
  let sewerSec = 0; for (let i = 0; i < hour.length; i++) if (hour[i].sewer) sewerSec += i + 1 < hour.length ? Math.min(60, (hour[i + 1].t - hour[i].t) / 1000) : 1;
  $("impactTitle").textContent = t("live_title");
  $("impact").innerHTML = `<div class="card" style="--c:${C.blue}"><div class="k">${t("rx_hour")}</div><span class="v num">${n0(hour.length)}</span></div>
    <div class="card" style="--c:${sewerSec ? C.bad : C.ok}"><div class="k">${t("sewer_hour")}</div><span class="v num">${sewerSec >= 90 ? (sewerSec / 60).toFixed(1) + " min" : Math.round(sewerSec) + " s"}</span></div>
    <div class="card" style="--c:${age !== null && age <= LIVE.staleSec ? C.ok : C.warn}"><div class="k">${t("last_rx")}</div><span class="v num">${last ? hms(last.t) : "—"}</span></div>`;

  setLog(live.events.map(e => ({ tm: hms(e.t), icon: ICONS[e.type] || "•", label: TXT["e_" + e.type] ? t("e_" + e.type) : e.type,
    reason: e.reason, valve: ["valve1", "valve2", "both"].includes(e.valve) ? e.valve : null, by: e.decided_by === "ai" ? "ai" : "rule" })));
  $("disclaimer").textContent = t("disc_live");
}

function loop() { if (mode === "sim" && running) sim.run(speed); render(); }
function start() { clearInterval(timer); timer = setInterval(loop, 1000); }

/* ===================== Controls ===================== */
$("srcLive").addEventListener("click", () => { mode = "live"; applyMode(); });
$("srcSim").addEventListener("click", () => { mode = "sim"; applyMode(); });
$("toSim").addEventListener("click", () => { mode = "sim"; applyMode(); });
$("backLive").addEventListener("click", () => { mode = "live"; applyMode(); });
$("runBtn").addEventListener("click", () => { running = !running; $("runBtn").textContent = running ? t("run") : t("paused"); $("runBtn").classList.toggle("on", running); });
$("speed").addEventListener("change", e => speed = +e.target.value);
document.querySelectorAll("[data-sc]").forEach(b => b.addEventListener("click", () => { sim.trigger(b.dataset.sc); render(); }));
$("langBtn").addEventListener("click", () => { lang = 1 - lang; try { localStorage.setItem("ebm-lang", lang ? "en" : "ar"); } catch (e) {} applyLang(); render(); });
$("applyBtn").addEventListener("click", () => {
  try {
    const times = {}; for (const p of PRAYERS) { times[p] = $("pt_" + p).value.trim(); toMin(times[p]); }
    const st = $("setStart").value.trim(); toMin(st);
    settings = { times, cfg: { worshippers: clip(+$("setW").value || 150, 20, 2000), lpa: clip(+$("setL").value || 3.5, 1, 10) }, start: st,
      friday: $("setFri").value === "1", logAi: $("setLogAi").value === "1" };
    $("setErr").textContent = ""; newSim(); render();
  } catch (e) { $("setErr").textContent = t("bad_time"); }
});

newSim(); applyLang(); applyMode(); start();
</script>
