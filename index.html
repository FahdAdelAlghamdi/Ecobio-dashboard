<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoBio-Matrix Command Center</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: control-room console — status header, live gauges, then detail panels in a 2-column grid that stacks on phones.
   Deliberately single dark look (an operations screen), so no light-theme blocks. */
:root {
  color-scheme: dark;
  --bg: #0B2321;        /* deep reservoir green */
  --panel: #123532;
  --line: #1F4743;
  --fg: #E9F1EE;
  --muted: #9BB8B1;
  --ok: #3DBE8B;
  --warn: #E8A93A;
  --bad: #F0603C;
  --blue: #5AB0F0;
  --display: 'Cairo', 'IBM Plex Sans Arabic', Tahoma, sans-serif;
  --body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1480px; margin: 0 auto; padding-inline: 20px; padding-block: 18px 40px; display: flex; flex-direction: column; gap: 16px; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* header */
.head { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
.title { font-family: var(--display); font-size: clamp(1.4rem, 3vw, 2.1rem); font-weight: 800; line-height: 1.2; margin: 0; text-wrap: balance; }
.title span { color: var(--ok); }
.sub { color: var(--muted); font-size: .9rem; }
.status { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.clock { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 16px; text-align: center; }
.clock b { display: block; font-family: var(--mono); font-size: 1.45rem; font-weight: 500; }
.clock small, .valve small { color: var(--muted); font-size: .78rem; }
.valve { border-radius: 12px; padding: 8px 16px; font-weight: 700; display: flex; flex-direction: column; justify-content: center; min-width: 170px; }
.valve.ok { background: rgba(61,190,139,.13); border: 1.5px solid var(--ok); color: var(--ok); }
.valve.bad { background: rgba(240,96,60,.16); border: 1.5px solid var(--bad); color: var(--bad); animation: pulse 1.2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(240,96,60,.55); } 70% { box-shadow: 0 0 0 12px rgba(240,96,60,0); } 100% { box-shadow: 0 0 0 0 rgba(240,96,60,0); } }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.controls .grp { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.controls .sep { width: 1px; align-self: stretch; background: var(--line); }
@media (max-width: 700px) { .controls .sep { display: none; } }
button, select, input { font: inherit; color: inherit; }
.btn { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap; }
.btn:hover { background: rgba(255,255,255,.05); border-color: var(--muted); }
.btn:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
.btn.primary { background: var(--ok); border-color: var(--ok); color: #0B2321; font-weight: 700; }
.btn.danger { border-color: rgba(240,96,60,.6); }
.btn.on { border-color: var(--ok); color: var(--ok); }
.lbl { color: var(--muted); font-size: .85rem; }
select, input[type=text], input[type=number] { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
details.settings { width: 100%; }
details.settings summary { cursor: pointer; color: var(--muted); font-size: .9rem; padding: 2px 0; }
.setgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
.setgrid label { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--muted); }
.setgrid input { width: 100%; min-width: 0; }

/* alert */
.alert { background: rgba(240,96,60,.12); border: 1px solid var(--bad); border-radius: 12px; padding: 10px 16px; }
.alert b { color: var(--bad); }

/* gauges */
.cards { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1100px) { .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card { background: var(--panel); border: 1px solid var(--line); border-inline-start: 4px solid var(--c, var(--ok)); border-radius: 12px; padding: 10px 14px; min-width: 0; }
.card .k { color: var(--muted); font-size: .82rem; }
.card .v { font-size: 1.65rem; font-weight: 700; }
.card .u { color: var(--muted); font-size: .8rem; margin-inline-start: 4px; }
.card .s { color: var(--c); font-size: .76rem; font-weight: 600; }

/* main grid */
.grid { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
h2 { font-size: 1.02rem; font-weight: 700; margin: 0; }
.charts4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .charts4 { grid-template-columns: minmax(0, 1fr); } }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; direction: ltr; min-width: 0; }
.chart .ct { color: var(--muted); font-size: .82rem; padding: 2px 8px 0; direction: inherit; }
[dir=rtl] .chart .ct { direction: rtl; text-align: right; }
.plot { width: 100%; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.panel h3 { margin: 0 0 4px; font-size: .86rem; color: var(--muted); font-weight: 600; }
.big { font-size: 1.5rem; font-weight: 700; line-height: 1.3; }
.small { color: var(--muted); font-size: .85rem; }
.bar { height: 7px; background: var(--line); border-radius: 6px; overflow: hidden; margin-top: 8px; }
.bar > div { height: 100%; border-radius: 6px; transition: width .4s; }
.impact { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .impact { grid-template-columns: minmax(0, 1fr); } }
.log { max-height: 290px; overflow-y: auto; }
.log div { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
.log .tm { color: var(--muted); font-family: var(--mono); margin-inline-end: 8px; }
.foot { color: var(--muted); font-size: .8rem; border-top: 1px solid var(--line); padding-top: 12px; }
@media (prefers-reduced-motion: reduce) { .valve.bad { animation: none; } .bar > div { transition: none; } }
</style>

</head>
<body>
<div class="wrap" id="app">
  <header class="head">
    <div>
      <p class="title">EcoBio-Matrix · <span data-t="title"></span></p>
      <div class="sub" data-t="subtitle"></div>
    </div>
    <div class="status">
      <div class="clock"><b class="num" id="clock">--:--</b><small id="dayname"></small></div>
      <div class="valve ok" id="valve"><small data-t="valve"></small><span id="valveTxt"></span></div>
    </div>
  </header>

  <section class="controls" aria-label="controls">
    <div class="grp">
      <button class="btn on" id="runBtn" type="button"></button>
      <label class="lbl" for="speed" data-t="speed"></label>
      <select id="speed"><option>1</option><option>2</option><option selected>5</option><option>10</option><option>15</option><option>30</option></select>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <span class="lbl" data-t="scenarios"></span>
      <button class="btn danger" type="button" data-sc="chlorine" data-t="sc_chlorine"></button>
      <button class="btn danger" type="button" data-sc="detergent" data-t="sc_detergent"></button>
      <button class="btn" type="button" data-sc="uv_aging" data-t="sc_uv"></button>
      <button class="btn" type="button" data-sc="replace_uv" data-t="sc_replace"></button>
      <button class="btn danger" type="button" data-sc="sensor_fault" data-t="sc_fault"></button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button class="btn" type="button" id="langBtn"></button>
    </div>
    <details class="settings">
      <summary data-t="settings"></summary>
      <div class="setgrid">
        <label><span data-t="worshippers"></span><input type="number" id="setW" min="20" max="2000" step="10" value="150"></label>
        <label><span data-t="lpa"></span><input type="number" id="setL" min="1" max="10" step="0.5" value="4"></label>
        <label><span data-t="start_time"></span><input type="text" id="setStart" value="11:05" inputmode="numeric"></label>
        <label><span data-t="start_friday"></span><select id="setFri"><option value="1" data-t="yes"></option><option value="0" data-t="no"></option></select></label>
        <label><span data-t="fajr"></span><input type="text" id="pt_fajr" inputmode="numeric"></label>
        <label><span data-t="dhuhr"></span><input type="text" id="pt_dhuhr" inputmode="numeric"></label>
        <label><span data-t="asr"></span><input type="text" id="pt_asr" inputmode="numeric"></label>
        <label><span data-t="maghrib"></span><input type="text" id="pt_maghrib" inputmode="numeric"></label>
        <label><span data-t="isha"></span><input type="text" id="pt_isha" inputmode="numeric"></label>
      </div>
      <p class="small" data-t="prayer_note"></p>
      <button class="btn primary" type="button" id="applyBtn" data-t="apply"></button>
      <span class="small" id="setErr" role="status"></span>
    </details>
  </section>

  <div class="alert" id="alert" hidden><b data-t="alert"></b><br><span id="alertTxt"></span></div>

  <section class="cards" id="cards" aria-label="sensors"></section>

  <section class="grid">
    <div class="col">
      <h2 data-t="sensors_title"></h2>
      <div class="charts4">
        <div class="chart"><div class="ct" id="ct_orp"></div><div class="plot" id="p_orp"></div></div>
        <div class="chart"><div class="ct" id="ct_turb"></div><div class="plot" id="p_turb"></div></div>
        <div class="chart"><div class="ct" id="ct_do"></div><div class="plot" id="p_do"></div></div>
        <div class="chart"><div class="ct" id="ct_ph"></div><div class="plot" id="p_ph"></div></div>
      </div>
    </div>
    <div class="col">
      <h2 data-t="ai_title"></h2>
      <div class="chart"><div class="ct" data-t="score"></div><div class="plot" id="p_score"></div></div>
      <div class="chart"><div class="ct" data-t="why"></div><div class="plot" id="p_why"></div></div>
      <div class="small" id="normalNote"></div>
    </div>
  </section>

  <section class="grid">
    <div class="col">
      <h2 data-t="forecast_title"></h2>
      <div class="chart"><div class="plot" id="p_fc"></div></div>
    </div>
    <div class="col">
      <div class="panel" id="peakPanel"></div>
      <div class="panel" id="energyPanel"></div>
      <div class="panel" id="maintPanel"></div>
    </div>
  </section>

  <section class="grid">
    <div class="col">
      <h2 data-t="water_title"></h2>
      <div class="impact" id="impact"></div>
    </div>
    <div class="col">
      <h2 data-t="log_title"></h2>
      <div class="panel log" id="log"></div>
    </div>
  </section>

  <footer class="foot"><span data-t="models_note"></span><br><span data-t="disclaimer"></span></footer>
</div>

"use strict";
/* ===================== Models (exported from scikit-learn) ===================== */
const MODELS = JSON.parse(document.getElementById("models").textContent);
function walk(tr, x) { const [f, t, l, r] = tr; let i = 0; while (f[i] !== -1) i = x[f[i]] <= t[i] ? l[i] : r[i]; return t[i]; }
// IsolationForest.decision_function — identical to scikit-learn
function anomalyDecision(x) {
  const F = MODELS.iforest; let s = 0;
  for (const tr of F.trees) s += walk(tr, x);
  return -Math.pow(2, -s / (F.trees.length * F.c)) - F.offset;
}
// HistGradientBoostingRegressor.predict — identical to scikit-learn
function hgbPredict(x) { let s = MODELS.hgb.base; for (const tr of MODELS.hgb.trees) s += walk(tr, x); return s; }

/* ===================== Simulation (port of sim.py) ===================== */
const PRAYERS = ["fajr", "dhuhr", "asr", "maghrib", "isha"];
const DEFAULT_TIMES = { fajr: "04:28", dhuhr: "11:43", asr: "15:08", maghrib: "17:38", isha: "19:08" };
const TRAIN_PER_PRAYER = 150 * 4;   // the forecaster was trained with 150 worshippers × 4 L
const LIMITS = { ph: [6.0, 9.0], turb: [null, 5.0], do: [1.0, null], orp: [null, 400.0], uv: [70.0, null] };
const NORMAL = { ph: [7.3, 0.12], turb: [2.0, 0.30], orp: [180, 15], do_resid: [0, 0.20] };
const UV_NORMAL_DECAY = 30 / (9000 * 60), UV_AGING_MULT = 5000;
const IRRIGATION = [[5 * 60 + 15, 6 * 60 + 30], [20 * 60, 21 * 60 + 30]];
const FEATURES = ["ph", "turb", "do_resid", "orp"];

const mod = (a, n) => ((a % n) + n) % n;
const clip = (v, a, b) => Math.min(b, Math.max(a, v));
const toMin = s => { const m = /^\s*(\d{1,2}):(\d{2})\s*$/.exec(s); if (!m || +m[1] > 23 || +m[2] > 59) throw new Error("time"); return +m[1] * 60 + +m[2]; };
const hhmm = m => { m = mod(Math.floor(m), 1440); return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
function randn(mu = 0, sd = 1) { let u = 0, v = 0; while (u === 0) u = Math.random(); while (v === 0) v = Math.random(); return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const doBaseline = aer => 1.2 + 2.6 * aer / 100;

function inflowAt(tod, pm, friday, cfg) {
  let flow = 0.3; const per = cfg.worshippers * cfg.lpa;
  for (const p of PRAYERS) {
    let vol = per, mu = pm[p] - 8, sd = 7;
    if (friday && p === "dhuhr") { vol = per * 3; mu = pm[p] - 25; sd = 16; }
    const d = mod(tod - mu + 720, 1440) - 720;
    flow += vol * Math.exp(-0.5 * (d / sd) ** 2) / (sd * Math.sqrt(2 * Math.PI));
  }
  return flow;
}
function features(tod, pm, friday) {
  const x = PRAYERS.map(p => clip(mod(tod - pm[p] + 720, 1440) - 720, -180, 180));
  x.push(friday ? 1 : 0, tod / 60); return x;
}

class Simulation {
  constructor(times, cfg, startMinute, startFriday) {
    this.cfg = cfg; this.pm = {}; for (const p of PRAYERS) this.pm[p] = toMin(times[p]);
    this.startWeekday = startFriday ? 4 : 3;
    this.minute = startMinute; this.bio = 1; this.uv = 96; this.uvAging = false; this.effects = [];
    this.faultLeft = 0; this.frozenPh = null; this.phWin = [];
    this.diverting = false; this.bad = 0; this.good = 0; this.diagnosis = null;
    this.tank = 900; this.reused = 0; this.diverted = 0; this.overflow = 0; this.aerSum = 0; this.ticks = 0;
    this.history = []; this.events = []; this._day = null; this.newDay();
  }
  get tod() { return mod(this.minute, 1440); }
  get day() { return Math.floor(this.minute / 1440); }
  get friday() { return (this.startWeekday + this.day) % 7 === 4; }
  forecastDay(friday) {
    const ratio = (this.cfg.worshippers * this.cfg.lpa) / TRAIN_PER_PRAYER, out = new Float64Array(1440);
    for (let t = 0; t < 1440; t++) out[t] = Math.max(0, 0.3 + (Math.max(0, hgbPredict(features(t, this.pm, friday))) - 0.3) * ratio);
    return out;
  }
  newDay() {
    this._day = this.day; this.fc = this.forecastDay(this.friday);
    this.actual = new Array(1440).fill(null); this.aerDay = new Array(1440).fill(null);
    this.attendance = 0.85 + Math.random() * 0.3;
    let best = 1; for (let t = 0; t < 1440; t++) { let s = 0; for (let k = 0; k < 30; k++) s += this.fc[(t + k) % 1440]; best = Math.max(best, s); }
    this.fcRef = best;
  }
  log(kind, detail) { this.events.unshift({ minute: this.minute, kind, detail }); this.events.length = Math.min(this.events.length, 60); }
  trigger(kind) {
    if (kind === "chlorine") { this.effects.push({ type: "chlorine", age: 0 }); this.bio *= 0.45; }
    else if (kind === "detergent") { this.effects.push({ type: "detergent", age: 0 }); this.bio *= 0.85; }
    else if (kind === "uv_aging") this.uvAging = true;
    else if (kind === "replace_uv") { this.uvAging = false; this.uv = 100; }
    else if (kind === "sensor_fault") { this.faultLeft = 90; this.frozenPh = null; }
    this.log(kind, null);
  }
  nextPeak() {
    let best = null;
    for (const p of PRAYERS) { const dt = mod(this.pm[p] - this.tod, 1440); if (!best || dt < best[1]) best = [p, dt]; }
    let vol = 0; for (let t = this.pm[best[0]] - 60; t < this.pm[best[0]] + 15; t++) vol += this.fc[mod(t, 1440)];
    return [best[0], best[1], vol];
  }
  uvDaysLeft() { const rate = UV_NORMAL_DECAY * (this.uvAging ? UV_AGING_MULT : 1); return this.uv <= LIMITS.uv[0] ? 0 : (this.uv - LIMITS.uv[0]) / rate / 1440; }
  monthlyM3() { const n = this.forecastDay(false).reduce((a, b) => a + b, 0), f = this.forecastDay(true).reduce((a, b) => a + b, 0); return (6 * n + f) / 7 * 30 / 1000; }
  get energySaved() { return this.ticks ? 100 - this.aerSum / this.ticks : 0; }

  step() {
    if (this.day !== this._day) this.newDay();
    const tod = this.tod;
    const truth = inflowAt(tod, this.pm, this.friday, this.cfg) * this.attendance;
    const inflow = Math.max(0, truth + randn(0, 0.15 + 0.12 * truth));

    const aer = clip(30 + 70 * nxt / this.fcRef, 30, 100);
    this.aerDay[tod] = aer; this.aerSum += aer;

    let phAdd = 0, turbAdd = 0, doSub = 0, orpAdd = 0;
    for (const e of this.effects) {
      const a = e.age;
      if (e.type === "chlorine") { orpAdd += 480 * Math.exp(-a / 25); phAdd += 0.5 * Math.exp(-a / 30); }
      else { turbAdd += 7 * Math.exp(-a / 40); doSub += 1.6 * Math.exp(-a / 40); phAdd += 0.45 * Math.exp(-a / 40); }
      e.age++;
    }
    this.effects = this.effects.filter(e => e.age < 200);
    this.bio += (1 - this.bio) * 0.02;

    let ph = randn(...NORMAL.ph) + phAdd;
    if (this.faultLeft > 0) { if (this.frozenPh === null) this.frozenPh = Math.round(ph * 100) / 100; ph = this.frozenPh; this.faultLeft--; } else this.frozenPh = null;
    this.phWin.push(ph); if (this.phWin.length > 10) this.phWin.shift();
    const phStuck = this.phWin.length === 10 && Math.max(...this.phWin) - Math.min(...this.phWin) < 1e-6;
    const turb = Math.max(0.1, randn(...NORMAL.turb) + 0.004 * inflow + (1 - this.bio) * 7 + turbAdd);
    const dox = Math.max(0, doBaseline(aer) + randn(...NORMAL.do_resid) + (1 - this.bio) * 2 - doSub);
    const orp = randn(...NORMAL.orp) + orpAdd;
    this.uv = Math.max(0, this.uv - UV_NORMAL_DECAY * (this.uvAging ? UV_AGING_MULT : 1));
    const uv = this.uv + randn(0, 0.3);

    const x = [ph, turb, dox - doBaseline(aer), orp];
    const score = -anomalyDecision(x);
    const z = x.map((v, i) => (v - MODELS.stats.mean[i]) / MODELS.stats.std[i]);
    const zd = {}; FEATURES.forEach((k, i) => zd[k] = z[i]);
    const mlFlag = score > 0 && Math.max(...z.map(Math.abs)) >= 3.5;

    const vals = { ph, turb, do: dox, orp, uv }, breaches = [];
    for (const k in LIMITS) { const [lo, hi] = LIMITS[k]; if ((lo !== null && vals[k] < lo) || (hi !== null && vals[k] > hi)) breaches.push(k); }
    // sensor health: a real probe always shows small noise; a flat line or a physically impossible value = sensor fault
    if (phStuck || ph < 0 || ph > 14 || turb > 1000 || dox > 20 || Math.abs(orp) > 1200) breaches.push("sensor");
    const flag = mlFlag || breaches.length > 0;
    if (flag) { this.bad++; this.good = 0; } else { this.good++; this.bad = 0; }

      this.diverting = true; this.diagnosis = Simulation.diagnose(zd, uv, breaches); this.log("divert", this.diagnosis);
    } else if (this.diverting && this.good >= 20) {
      this.diverting = false; this.log("recover", this.diagnosis); this.diagnosis = null;
    }

    let demand = 0.3 * inflow + 0.2;

    this.tank -= supply; this.reused += supply;
    if (this.tank > 2500) { this.overflow += this.tank - 2500; this.tank = 2500; }

    this.ticks++;
    this.history.push({ minute: this.minute, ph, turb, do: dox, orp, uv, level: 100 * this.tank / 2500, inflow, aer, score, flag,
      diverting: this.diverting, z_ph: zd.ph, z_turb: zd.turb, z_do: zd.do_resid, z_orp: zd.orp });
    if (this.history.length > 720) this.history.shift();
    this.minute++;
  }
  static diagnose(zd, uv, b) {
    if (b.includes("sensor")) return "sensor";
    if (zd.orp > 4 || b.includes("orp")) return "chlorine";
    if (zd.turb > 4 && zd.do_resid < -3) return "detergent";
    if (b.includes("uv") || uv < LIMITS.uv[0]) return "uv";
    if (Math.abs(zd.ph) > 4 || b.includes("ph")) return "ph";
    if (zd.turb > 4 || b.includes("turb")) return "turbidity";
    return "pattern";
  }
  run(n) { for (let i = 0; i < n; i++) this.step(); }
}

  sc_uv: ["💡 تقادم لمبة UV", "💡 UV lamp aging"], sc_replace: ["🔧 استبدال لمبة UV", "🔧 Replace UV lamp"], sc_fault: ["🔌 عطل حساس pH", "🔌 pH sensor fault"],
  lang: ["English", "العربية"],
  settings: ["⚙ الإعدادات", "⚙ Settings"],
  worshippers: ["عدد المتوضئين لكل صلاة", "Worshippers per prayer"], lpa: ["لترات لكل وضوء (افتراض)", "Liters per ablution (assumption)"],
  start_time: ["وقت البداية", "Start time"], start_friday: ["ابدأ يوم الجمعة", "Start on a Friday"], yes: ["نعم", "Yes"], no: ["لا", "No"],
  prayer_note: ["أوقات الصلاة تقريبية للرياض — عدّلها بصيغة HH:MM.", "Prayer times are approximate for Riyadh — edit as HH:MM."],
  apply: ["تطبيق وإعادة التشغيل", "Apply & restart"], bad_time: ["اكتب الأوقات بصيغة HH:MM مثل 04:28", "Enter times as HH:MM, e.g. 04:28"],
  valve: ["الصمام", "Valve"], irrigation: ["ري ✓", "IRRIGATION ✓"], diverted: ["تحويل للصرف ✕", "DIVERTED TO SEWER ✕"],
  alert: ["⚠ تنبيه: تم تحويل المياه للصرف تلقائياً", "⚠ Alert: water automatically diverted to the sewer"],
  ph: ["الحموضة pH", "pH"], turb: ["العكارة", "Turbidity"], do: ["الأكسجين المذاب", "Dissolved O₂"], orp: ["جهد الأكسدة ORP", "ORP"],
  uv: ["شدة لمبة UV", "UV lamp"], level: ["مستوى الخزان", "Tank level"],
  st_ok: ["طبيعي", "normal"], st_warn: ["تحذير", "warning"], st_alarm: ["خارج الحد", "out of limit"],
  sensors_title: ["قراءات الحساسات (آخر 12 ساعة)", "Sensor readings (last 12 h)"],
  ai_title: ["🧠 الذكاء الاصطناعي: كشف الشذوذ", "🧠 AI: anomaly detection"],
  score: ["درجة الشذوذ (Isolation Forest) — فوق الصفر = شاذ", "Anomaly score (Isolation Forest) — above zero = anomalous"],
  why: ["لماذا؟ انحراف كل حساس عن الطبيعي (σ)", "Why? Each sensor's deviation from normal (σ)"],
  normal_state: ["✅ كل القراءات طبيعية — المياه تذهب للري", "✅ All readings normal — water goes to irrigation"],
  forecast_title: ["🕌 التنبؤ بالتدفق حسب أوقات الصلاة", "🕌 Inflow forecast from prayer times"],
  forecast: ["التدفق المتوقع (نموذج ML)", "Forecast inflow (ML model)"], actual: ["التدفق الفعلي", "Actual inflow"],
  aeration: ["التهوية %", "Aeration %"], now: ["الآن", "now"], lpm: ["لتر/دقيقة", "L/min"],
  next_peak: ["⏱ الذروة القادمة", "⏱ Next peak"], in_min: ["بعد {m} دقيقة", "in {m} min"], fc_vol: ["حجم متوقع ≈ {v} لتر", "expected ≈ {v} L"],
  aer_now: ["التهوية الآن {a}%", "Aeration now {a}%"], preboost: ["رفع مسبق قبل الذروة", "pre-boosting before the peak"],
  energy: ["⚡ توفير طاقة التهوية", "⚡ Aeration energy saved"], energy_sub: ["مقارنة بتشغيل المضخة 100% طوال الوقت", "vs running the blower at 100% all the time"],
  maint: ["🔧 الصيانة التنبؤية", "🔧 Predictive maintenance"], uv_left: ["استبدال لمبة UV بعد ≈ {x}", "Replace UV lamp in ≈ {x}"],
  uv_now: ["لمبة UV أقل من الحد الآمن — استبدلها الآن", "UV lamp below the safe limit — replace now"],
  days: ["{n} يوم", "{n} days"], hours: ["{n} ساعة", "{n} h"], safe_limit: ["حد الأمان", "safe limit"],
  water_title: ["💧 أثر المياه", "💧 Water impact"], reused: ["مياه أُعيد استخدامها", "Water reused"],
  unsafe: ["حُوّلت للصرف (غير آمنة)", "Diverted (unsafe)"], month: ["التوقع الشهري بالإعدادات الحالية", "Monthly projection at current settings"],
  log_title: ["📋 سجل الأحداث", "📋 Event log"],
  ev_start: ["بدأت المحاكاة", "Simulation started"], ev_chlorine: ["سيناريو: إضافة صدمة كلور", "Scenario: chlorine shock injected"],
  ev_detergent: ["سيناريو: حمل منظفات زائد", "Scenario: detergent overload injected"], ev_uv_aging: ["سيناريو: تسريع تقادم لمبة UV", "Scenario: UV lamp aging (fast-forward)"],
  ev_replace_uv: ["صيانة: تم استبدال لمبة UV", "Maintenance: UV lamp replaced"], ev_sensor_fault: ["سيناريو: تجمّد قراءة حساس pH", "Scenario: pH sensor reading frozen"], ev_divert: ["تنبيه — تحويل المياه للصرف: {d}", "ALERT — water diverted to sewer: {d}"],
  ev_recover: ["عادت القراءات طبيعية — استئناف الري", "Readings back to normal — irrigation resumed"],
  dg_chlorine: ["صدمة مادة مؤكسدة (كلور): ارتفاع حاد في ORP — حماية البكتيريا بتحويل المياه", "Oxidiser (chlorine) shock: sharp ORP spike — bacteria protected by diverting flow"],
  dg_detergent: ["حمل منظفات/مواد عضوية زائد: العكارة ترتفع والأكسجين ينخفض", "Detergent/organic overload: turbidity up, oxygen down"],
  dg_uv: ["لمبة UV أقل من الشدة الآمنة: التعقيم غير مضمون", "UV lamp below safe intensity: disinfection not guaranteed"],
  dg_ph: ["صدمة في الحموضة pH", "pH shock"], dg_turbidity: ["عكارة عالية", "High turbidity"], dg_pattern: ["نمط غير طبيعي اكتشفه النموذج", "Unusual sensor pattern detected by the AI model"],
  dg_sensor: ["عطل حساس: قراءة pH ثابتة بدون أي تذبذب — وضع آمن (تحويل للصرف) وطلب صيانة", "Sensor fault: pH reading frozen with no noise — safe mode (divert) and maintenance request"],
  fajr: ["الفجر", "Fajr"], dhuhr: ["الظهر", "Dhuhr"], jumuah: ["الجمعة", "Jumu'ah"], asr: ["العصر", "Asr"], maghrib: ["المغرب", "Maghrib"], isha: ["العشاء", "Isha"],
  models_note: ["النماذج نفسها في نسخة Python: Isolation Forest (150 شجرة) لكشف الشذوذ و Gradient Boosting للتنبؤ، دُرّبت بمكتبة scikit-learn وصُدّرت لتعمل في المتصفح بنفس النتائج.",
                "Same models as the Python version: Isolation Forest (150 trees) for anomaly detection and Gradient Boosting for forecasting, trained in scikit-learn and exported to run in the browser with identical results."],
  disclaimer: ["جميع القراءات مُحاكاة، وحدود الأمان قيم تجريبية تُستبدل بمواصفات الوزارة الرسمية.", "All readings are simulated; safety limits are demo values to be replaced with official MEWA specifications."],
};
const DAYS = [["الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت", "الأحد"], ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]];
const UNITS = { ph: "", turb: "NTU", do: "mg/L", orp: "mV", uv: "%", level: "%" };
let lang = 0;
try { if (localStorage.getItem("ebm-lang") === "en") lang = 1; } catch (e) {}
const t = (k, o) => { let s = TXT[k][lang]; if (o) for (const q in o) s = s.replace("{" + q + "}", o[q]); return s; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ===================== State ===================== */
const C = { bg: "#0B2321", panel: "#123532", line: "#1F4743", fg: "#E9F1EE", muted: "#9BB8B1", ok: "#3DBE8B", warn: "#E8A93A", bad: "#F0603C", blue: "#5AB0F0" };
let settings = { times: { ...DEFAULT_TIMES }, cfg: { worshippers: 150, lpa: 4 }, start: "11:05", friday: true };
let sim, running = true, speed = 5, timer = null;

function newSim() {
  const warm = 120;
  sim = new Simulation(settings.times, { ...settings.cfg }, mod(toMin(settings.start) - warm, 1440), settings.friday);
  sim.run(warm); sim.events = []; sim.log("start", null);
  monthlyCache = sim.monthlyM3();
}
let monthlyCache = 0;

/* ===================== Rendering ===================== */
const $ = id => document.getElementById(id);
function applyLang() {
  document.documentElement.lang = lang ? "en" : "ar";
  document.documentElement.dir = lang ? "ltr" : "rtl";
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  $("langBtn").textContent = t("lang");
  $("runBtn").textContent = running ? t("run") : t("paused");
  for (const k of ["orp", "turb", "do", "ph"]) $("ct_" + k).textContent = t(k) + (UNITS[k] ? " (" + UNITS[k] + ")" : "");
  for (const p of PRAYERS) $("pt_" + p).value = settings.times[p];
}
function isoOf(m) {
  const base = sim.startWeekday === 4 ? Date.UTC(2026, 9, 9) : Date.UTC(2026, 9, 8);
  return new Date(base + m * 60000).toISOString().slice(0, 16).replace("T", " ");
}
function layout(h, extra) {
  return Object.assign({
    height: h, margin: { l: 44, r: 12, t: 8, b: 30 }, paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: C.bg,
    font: { family: "IBM Plex Sans Arabic, Tahoma, sans-serif", color: C.fg, size: 11 }, showlegend: false,
    xaxis: { gridcolor: C.line, zeroline: false, tickformat: "%H:%M", fixedrange: true },
    yaxis: { gridcolor: C.line, zeroline: false, fixedrange: true }, hovermode: "x unified",
  }, extra || {});
}
const PCFG = { displayModeBar: false, responsive: true };
function divertShapes(h) {
  const out = []; let s = null;
  for (const r of h) { if (r.diverting && s === null) s = r.minute; if (!r.diverting && s !== null) { out.push([s, r.minute]); s = null; } }
  if (s !== null) out.push([s, h[h.length - 1].minute + 1]);
  return out.map(([a, b]) => ({ type: "rect", xref: "x", yref: "paper", x0: isoOf(a), x1: isoOf(b), y0: 0, y1: 1, fillcolor: C.bad, opacity: 0.14, line: { width: 0 } }));
}
function statusOf(k, row) {
  if (LIMITS[k]) { const [lo, hi] = LIMITS[k]; if ((lo !== null && row[k] < lo) || (hi !== null && row[k] > hi)) return ["alarm", C.bad]; }
  if (k === "level") return row[k] < 10 || row[k] > 97 ? ["warn", C.warn] : ["ok", C.ok];
  if (k === "uv") return row[k] < 80 ? ["warn", C.warn] : ["ok", C.ok];
  return Math.abs(row["z_" + k]) >= 3 ? ["warn", C.warn] : ["ok", C.ok];
}
const fmtL = v => v >= 1000 ? (v / 1000).toLocaleString("en", { maximumFractionDigits: 2, minimumFractionDigits: 2 }) + " m³" : Math.round(v).toLocaleString("en") + " L";
const n0 = v => Math.round(v).toLocaleString("en");

function render() {
  const h = sim.history, row = h[h.length - 1], xs = h.map(r => isoOf(r.minute));
  $("clock").textContent = hhmm(sim.minute);
  $("dayname").textContent = DAYS[lang][(sim.startWeekday + sim.day) % 7];
  const v = $("valve"); v.className = "valve " + (sim.diverting ? "bad" : "ok"); $("valveTxt").textContent = sim.diverting ? t("diverted") : t("irrigation");
  $("alert").hidden = !(sim.diverting && sim.diagnosis);
  if (sim.diagnosis) $("alertTxt").textContent = t("dg_" + sim.diagnosis);

  const fmt = { ph: 2, turb: 1, do: 1, orp: 0, uv: 1, level: 0 };
  $("cards").innerHTML = Object.keys(fmt).map(k => {
    const [st, col] = statusOf(k, row);
    return `<div class="card" style="--c:${col}"><div class="k">${t(k)}</div><span class="v num">${row[k].toFixed(fmt[k])}</span><span class="u">${UNITS[k]}</span><div class="s">● ${t("st_" + st)}</div></div>`;
  }).join("");

  const shapes = divertShapes(h);
  const sensorCol = { orp: C.bad, turb: C.warn, do: C.blue, ph: C.ok };
  for (const k of ["orp", "turb", "do", "ph"]) {
    const lim = LIMITS[k].filter(x => x !== null).map(y => ({ type: "line", xref: "paper", x0: 0, x1: 1, y0: y, y1: y, line: { color: C.bad, dash: "dot", width: 1 } }));
    Plotly.react("p_" + k, [{ x: xs, y: h.map(r => r[k]), mode: "lines", line: { color: sensorCol[k], width: 1.8 }, name: t(k), hovertemplate: "%{y:.2f}<extra></extra>" }],
      layout(185, { shapes: shapes.concat(lim) }), PCFG);
  }
  const fl = h.filter(r => r.flag);
  Plotly.react("p_score", [
    { x: xs, y: h.map(r => r.score), mode: "lines", line: { color: C.blue, width: 1.8 }, fill: "tozeroy", fillcolor: "rgba(90,176,240,.12)", hovertemplate: "%{y:.3f}<extra></extra>" },
    { x: fl.map(r => isoOf(r.minute)), y: fl.map(r => r.score), mode: "markers", marker: { color: C.bad, size: 6 }, hoverinfo: "skip" }],
    layout(190, { shapes: [{ type: "line", xref: "paper", x0: 0, x1: 1, y0: 0, y1: 0, line: { color: C.bad, dash: "dash", width: 1.5 } }] }), PCFG);

  const wk = ["orp", "turb", "do", "ph"], wv = wk.map(k => Math.abs(row["z_" + k]));
  Plotly.react("p_why", [{ type: "bar", orientation: "h", x: wv, y: wk.map(k => t(k)), marker: { color: wv.map(v => v >= 4 ? C.bad : v >= 3 ? C.warn : C.ok) },
    text: wv.map(v => v.toFixed(1) + "σ"), textposition: "outside", cliponaxis: false, hoverinfo: "skip" }],
    layout(170, { margin: { l: 110, r: 30, t: 6, b: 24 }, hovermode: false, xaxis: { gridcolor: C.line, range: [0, Math.max(6, Math.max(...wv) * 1.25)], fixedrange: true },
      yaxis: { autorange: "reversed", fixedrange: true } }), PCFG);
  $("normalNote").textContent = sim.diverting ? "" : t("normal_state");

  // forecast
  const m0 = sim.day * 1440, fx = [], fy = [], ay = [], ey = [];
  for (let i = 0; i < 1440; i += 2) { fx.push(isoOf(m0 + i)); fy.push(sim.fc[i]); ay.push(sim.actual[i] ?? sim.actual[i + 1]); ey.push(sim.aerDay[i]); }
  const ymax = Math.max(...sim.fc, ...sim.actual.filter(v => v !== null)) * 1.15;
  const fshapes = [], anns = [];
  PRAYERS.forEach((p, i) => {
    const px = isoOf(m0 + sim.pm[p]);
    fshapes.push({ type: "line", x0: px, x1: px, yref: "paper", y0: 0, y1: 1, line: { color: C.line, width: 1 } });
    anns.push({ x: px, y: ymax * (i % 2 ? 0.9 : 1.0), text: (p === "dhuhr" && sim.friday) ? t("jumuah") : t(p), showarrow: false, yanchor: "bottom", font: { color: C.muted, size: 11 }, bgcolor: C.bg });
  });
  const nowx = isoOf(sim.minute);
  fshapes.push({ type: "line", x0: nowx, x1: nowx, yref: "paper", y0: 0, y1: 1, line: { color: C.fg, width: 1.4, dash: "dot" } });
  anns.push({ x: nowx, y: ymax * 0.72, text: t("now"), showarrow: false, xanchor: "left", xshift: 4, font: { color: C.fg, size: 11 } });
  Plotly.react("p_fc", [
    { x: fx, y: fy, mode: "lines", name: t("forecast"), line: { color: C.muted, width: 1.8, dash: "dash" } },
    { x: fx, y: ay, mode: "lines", name: t("actual"), line: { color: C.ok, width: 1.8 }, fill: "tozeroy", fillcolor: "rgba(61,190,139,.18)" },
    { x: fx, y: ey, mode: "lines", name: t("aeration"), line: { color: C.warn, width: 1.4 }, yaxis: "y2" }],
    layout(320, { showlegend: true, legend: { orientation: "h", y: 1.12, x: 0, bgcolor: "rgba(0,0,0,0)" }, margin: { l: 48, r: 44, t: 30, b: 30 },
      yaxis: { gridcolor: C.line, range: [0, ymax * 1.12], title: { text: t("lpm"), font: { size: 11 } }, fixedrange: true },
      yaxis2: { overlaying: "y", side: "right", range: [0, 112], tickvals: [0, 25, 50, 75, 100], ticksuffix: "%", showgrid: false, fixedrange: true },
      shapes: fshapes, annotations: anns }), PCFG);

  // panels
  const [p, dt, vol] = sim.nextPeak(), aer = row.aer;
  const pname = (p === "dhuhr" && sim.friday) ? t("jumuah") : t(p);
  $("peakPanel").innerHTML = `<h3>${t("next_peak")}</h3><div class="big">${pname} <span class="small">${t("in_min", { m: `<span class="num">${dt}</span>` })}</span></div>
    <div class="small">${t("fc_vol", { v: `<span class="num">${n0(vol)}</span>` })}</div>
    <div class="small">${t("aer_now", { a: `<span class="num">${aer.toFixed(0)}</span>` })}${aer > 60 && dt <= 45 ? ` · <span style="color:${C.warn}">${t("preboost")}</span>` : ""}</div>
    <div class="bar"><div style="width:${aer.toFixed(0)}%;background:${C.warn}"></div></div>`;
  $("energyPanel").innerHTML = `<h3>${t("energy")}</h3><div class="big" style="color:${C.ok}"><span class="num">${sim.energySaved.toFixed(0)}%</span></div><div class="small">${t("energy_sub")}</div>`;
  const days = sim.uvDaysLeft(); let msg, col;
  if (days <= 0) { msg = t("uv_now"); col = C.bad; }
  else { msg = t("uv_left", { x: `<span class="num">${days >= 2 ? t("days", { n: n0(days) }) : t("hours", { n: (days * 24).toFixed(1) })}</span>` }); col = days < 30 ? C.warn : C.ok; }
  const uvp = clip(sim.uv, 0, 100);
  $("maintPanel").innerHTML = `<h3>${t("maint")}</h3><div class="big" style="color:${col};font-size:1.1rem">${msg}</div>
    <div class="small">${t("uv")}: <span class="num">${uvp.toFixed(1)}%</span> · ${t("safe_limit")} <span class="num">70%</span></div>
    <div class="bar"><div style="width:${uvp.toFixed(0)}%;background:${col}"></div></div>`;

  $("impact").innerHTML = `<div class="card" style="--c:${C.ok}"><div class="k">${t("reused")}</div><span class="v num">${fmtL(sim.reused)}</span></div>
    <div class="card" style="--c:${C.bad}"><div class="k">${t("unsafe")}</div><span class="v num">${fmtL(sim.diverted)}</span></div>
    <div class="card" style="--c:${C.blue}"><div class="k">${t("month")}</div><span class="v num">≈ ${n0(monthlyCache)} m³</span></div>`;

  const icons = { start: "▶", chlorine: "🧪", detergent: "🫧", uv_aging: "💡", replace_uv: "🔧", sensor_fault: "🔌", divert: "⛔", recover: "✅" };
  $("log").innerHTML = sim.events.slice(0, 25).map(e => {
    const m = e.kind === "divert" ? t("ev_divert", { d: t("dg_" + e.detail) }) : t("ev_" + e.kind);
    return `<div><span class="tm">${hhmm(e.minute)}</span>${icons[e.kind] || "•"} ${esc(m)}</div>`;
  }).join("");
}

function loop() { if (running) sim.run(speed); render(); }
function start() { clearInterval(timer); timer = setInterval(loop, 1000); }

/* ===================== Controls ===================== */
$("runBtn").addEventListener("click", () => { running = !running; $("runBtn").textContent = running ? t("run") : t("paused"); $("runBtn").classList.toggle("on", running); });
$("speed").addEventListener("change", e => speed = +e.target.value);
document.querySelectorAll("[data-sc]").forEach(b => b.addEventListener("click", () => { sim.trigger(b.dataset.sc); render(); }));
$("langBtn").addEventListener("click", () => { lang = 1 - lang; try { localStorage.setItem("ebm-lang", lang ? "en" : "ar"); } catch (e) {} applyLang(); render(); });
$("applyBtn").addEventListener("click", () => {
  try {
    const times = {}; for (const p of PRAYERS) { times[p] = $("pt_" + p).value.trim(); toMin(times[p]); }
    const st = $("setStart").value.trim(); toMin(st);
    settings = { times, cfg: { worshippers: clip(+$("setW").value || 150, 20, 2000), lpa: clip(+$("setL").value || 4, 1, 10) }, start: st, friday: $("setFri").value === "1" };
    $("setErr").textContent = ""; newSim(); render();
  } catch (e) { $("setErr").textContent = t("bad_time"); }
});

newSim(); applyLang(); render(); start();
</script>

</body>
</html>
